name: Build specs (and publish them when main branch is updated) 

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    env:
      BUILD_MACHINE: true

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # SVG 2 is built with Bikeshed (see tools/svg2-build/README.md); the
      # modules under specs/ still use the old build, which needs Node.
      - name: Set up Python for Bikeshed
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Bikeshed
        run: pip install 'bikeshed>=7.2.0'

      - name: Build all specs
        run: make all-specs

      - name: Prepare deployment to GitHub Pages
        run: ./tools/deploy.sh

      # See doc at https://github.com/marketplace/actions/deploy-to-github-pages
      - name: Deploy to GitHub Pages if pushing to main
        if: ${{ github.event_name == 'push' }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: deploy

  # Fails when SVG 2 loses an id it has published (tools/svg2-build/baseline/),
  # on the chapter pages or on the single page. Does not block the
  # publication above.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run the unit tests of the build scripts
        run: make test

      - name: Install Bikeshed
        run: pip install 'bikeshed>=7.2.0'

      - name: Build SVG 2 and check its ids
        run: make check

      - name: Keep the check report and the Bikeshed log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: svg2-check
          path: |
            build/bikeshed/losses.tsv
            build/bikeshed/work/build.log
          if-no-files-found: ignore
